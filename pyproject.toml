[project]
name = "groundlink"
version = "0.1.0"
description = "GroundLink: Real-Time Adaptive Drone Mission Planner"
requires-python = ">=3.10"
dependencies = [
    "mavsdk>=2.4.0",
    "shapely>=2.0.0",
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "mission_planner*",
    "firmware_link*",
    "constraint_monitor*",
    "replanning_engine*",
    "dashboard*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
